<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/icons/favicon.ico" type="image/x-icon">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <title>Auchan</title>

</head>
<body class="bg-gray-100 text-gray-800 antialiased font-sans">

    <header class="px-4 bg-white shadow-xs border-b border-gray-200">
        <div class="flex justify-between items-center h-16">
            
            <div class="flex items-center">
                <a href="index.html">
                    <img src="assets/images/auchan-logo.svg" alt="auchan-logo" class="h-8">
                </a>
            </div>

            <div class="flex items-center gap-10">
                <nav class="flex gap-6">
                    <a class="font-medium text-black hover:text-red-600" href="index.html">Products</a>
                    <a class="font-medium text-black hover:text-red-600" href="contact.html">Contactez-nous</a>
                </nav>

                <div class="flex items-center gap-2 border border-gray-200 hover:border-red-600 bg-gray-50 hover:bg-red-50/50 rounded-lg cursor-pointer px-3 py-2">
                    <svg class="w-6 h-6 text-red-600" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor">
                        <path d="M200-80q-33 0-56.5-23.5T120-160v-480q0-33 23.5-56.5T200-720h80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720h80q33 0 56.5 23.5T840-640v480q0 33-23.5 56.5T760-80H200Zm0-80h560v-480H200v480Zm421.5-298.5Q680-517 680-600h-80q0 50-35 85t-85 35q-50 0-85-35t-35-85h-80q0 83 58.5 141.5T480-400q83 0 141.5-58.5ZM360-720h240q0-50-35-85t-85-35q-50 0-85 35t-35 85ZM200-160v-480 480Z"/>
                    </svg>
                    <span class="font-bold text-red-600">0.00 DH</span>
                </div>
            </div>

        </div>
    </header>

    <main class="mx-auto px-4">

        <section class="mt-6">
            <div class="flex justify-between items-stretch gap-4">

                <div class="flex gap-3 items-center">
                    
                    <div class="flex items-center gap-2 w-full sm:w-80 px-3 py-2 bg-white rounded-lg border border-gray-200 focus-within:border-red-500 focus-within:ring-2 focus-within:ring-red-100 shadow-2xs">
                        <svg class="w-5 h-5 text-gray-400 shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor">
                            <path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/>
                        </svg>
                        <input id="input-items-search" class="focus:outline-none w-full bg-transparent text-sm [&::-webkit-search-cancel-button]:hidden" type="search" placeholder="Recherche un produit...">
                    </div>

                    <div>
                        <select id="select-items-category" class="px-4 py-2.5 bg-white rounded-lg border border-gray-200 text-sm focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-100 shadow-2xs cursor-pointer">
                            <option value="" selected="selected">Category</option>
                            <option value="test">Category 1</option>
                            <option value="test">Category 2</option>
                            <option value="test">Category 3</option>
                        </select>
                    </div>

                </div>

                <div class="flex items-center gap-3">

                    <div class="flex items-center gap-1 bg-gray-200/80 p-1 rounded-lg">
                        <button class="p-2 bg-white rounded-md shadow-xs text-red-600 hover:bg-gray-50 cursor-pointer">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                            </svg>
                        </button>
                        <button class="p-2 bg-transparent text-gray-500 hover:text-gray-800 rounded-md cursor-pointer">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                            </svg>
                        </button>
                    </div>

                    <select id="select-items-sort" class="px-4 py-2.5 bg-white rounded-lg border border-gray-200 text-sm focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-100 shadow-2xs cursor-pointer">
                        <option value="" selected="selected">Pertinence</option>
                        <option value="test">Prix Croissant</option>
                        <option value="test">Prix Décroissant</option>
                        <option value="test">Marques de A - Z</option>
                        <option value="test">Marques de Z - A</option>
                    </select>

                </div>
                    
            </div>
        </section>

        <section class="mt-8">
            <div id="container-store-products" class="grid gap-4 grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6">

                <div class="bg-white rounded-2xl p-4 shadow-sm flex flex-col justify-between cursor-grab" draggable="true">
                    
                    <div>

                        <div class="flex justify-center mt-2">
                            <img class="object-cover rounded-2xl" src="assets/images/item_1.jpg" alt="item image" draggable="false">
                        </div>

                        <div class="flex justify-center gap-0.5 items-center mt-3 shrink-0">
                            <svg class="shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="20px" width="20px" fill="#F19E39"><path d="M5.83,21l1.63-7.03L2,9.25L9.2,8.63L12,2l2.8,6.63L22,9.25l-5.45,4.72L18.18,21L12,17.27L5.83,21Z"/></svg>
                            <svg class="shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="20px" width="20px" fill="#F19E39"><path d="M5.83,21l1.63-7.03L2,9.25L9.2,8.63L12,2l2.8,6.63L22,9.25l-5.45,4.72L18.18,21L12,17.27L5.83,21Z"/></svg>
                            <svg class="shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="20px" width="20px" fill="#F19E39"><path d="M5.83,21l1.63-7.03L2,9.25L9.2,8.63L12,2l2.8,6.63L22,9.25l-5.45,4.72L18.18,21L12,17.27L5.83,21Z"/></svg>
                            <svg class="shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="20px" width="20px" fill="#F19E39"><path d="M5.83,21l1.63-7.03L2,9.25L9.2,8.63L12,2l2.8,6.63L22,9.25l-5.45,4.72L18.18,21L12,17.27L5.83,21Z"/></svg>
                            <svg class="shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="20px" width="20px" fill="#F19E39"><path d="M15.15,16.85l-0.82-3.6l2.78-2.4l-3.65-0.33L12,7.13v7.8l3.15,1.93ZM5.83,21l1.63-7.03L2,9.25L9.2,8.63L12,2l2.8,6.63L22,9.25l-5.45,4.72L18.18,21L12,17.27L5.83,21Z"/></svg>
                            <p class="text-xs shrink-0 ml-1">(30)</p>
                        </div>

                        <div class="mt-3 flex flex-wrap gap-1 items-baseline">
                            <p class="text-sm"><strong>NUTELLA</strong> Pâte à tartiner aux noisettes</p>

                            <div class="flex gap-1">
                                <p class="border border-gray-300 rounded-md px-1 text-[11px] shrink-0">test</p>
                                <p class="border border-gray-300 rounded-md px-1 text-[11px] shrink-0">test 2</p>
                            </div>

                        </div>

                    </div>

                    <div class="mt-4">
                        <span class="text-green-700 font-bold text-2xl">19.99 DH</span>
                    </div>

                </div>

            </div>
        </section>

    </main>

    <script type="module" src="js/main.js"></script>

</body>
</html>
